name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Type check
        run: mypy
      - name: Brand assets are reproducible and originals untouched
        run: python scripts/build_assets.py
      - name: Unit tests (no models, no audio hardware, no network)
        run: python -m pytest -q -o faulthandler_timeout=120
      - name: Components load
        run: python -m chiku --version-info
