name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e ".[dev,packaging]"
      - name: Tests
        run: .\.venv\Scripts\python.exe -m pytest -q -o faulthandler_timeout=120
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = .\.venv\Scripts\python.exe -c "import chiku; print(chiku.__version__)"
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} != version $v" }
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiku-installer
          path: |
            packaging/output/Chiku-Setup-*.exe
            packaging/output/Chiku-Setup-*.exe.sha256
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          body_path: CHANGELOG.md
          files: |
            packaging/output/Chiku-Setup-*.exe
            packaging/output/Chiku-Setup-*.exe.sha256
