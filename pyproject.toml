[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chiku"
version = "0.5.0"
description = "Chiku: a local-first, female-voiced personal AI assistant for Windows 11"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Intruder-tech" }]
dependencies = [
    "numpy>=2.0",
    "sounddevice>=0.5",
    "onnxruntime>=1.20",
    "faster-whisper>=1.1",
    "kokoro-onnx>=0.4.7",
    "httpx>=0.27",
    "pydantic>=2.7",
    "keyring>=25",
    "psutil>=6",
    "PySide6-Essentials>=6.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pillow>=10"]
packaging = ["pyinstaller>=6.16", "pillow>=10"]
# GPU speech recognition (NVIDIA). ~1.2 GB download; CPU fallback works without it.
cuda = ["nvidia-cublas-cu12>=12.4", "nvidia-cudnn-cu12>=9.1"]

[project.gui-scripts]
chiku = "chiku.__main__:main"

[project.scripts]
chiku-cli = "chiku.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chiku = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "models: needs downloaded STT/TTS/VAD models",
    "ollama: needs a running local Ollama server with the configured model",
    "audio: needs real audio hardware",
    "system: changes real Windows state (e.g. puts a temp file in the Recycle Bin)",
    "network: contacts real internet services",
]
addopts = "-m 'not models and not ollama and not audio and not system and not network'"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S603", "S607", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.11"
packages = ["chiku"]
mypy_path = "src"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
check_untyped_defs = true
